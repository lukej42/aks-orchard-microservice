trigger: [main]

parameters:
- name: deploy_sites
  type: string
  default: 'alpha,bravo,charlie' # Add your new site names here!

variables:
  imageRepository: 'myacr.azurecr.io/orchard-core'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  jobs:
  - job: DockerBuild
    steps:
    - task: Docker@2
      inputs:
        command: buildAndPush
        repository: orchard-core
        tags: $(tag)

- stage: Deploy
  dependsOn: Build
  jobs:
  - ${{ each site in split(parameters.deploy_sites, ',') }}:
    - deployment: Deploy_${{ site }}
      environment: '${{ site }}' # Remember to create these in Azure DevOps UI!
      strategy:
        runOnce:
          deploy:
            steps:
            - checkout: self
            - task: HelmDeploy@0
              inputs:
                command: upgrade
                releaseName: "orchard-${{ site }}"
                chartPath: 'helm/orchard-chart'
                valueFile: 'helm/orchard-chart/instances/values-${{ site }}.yaml'
                overrideValues: "image.tag=$(tag)"